# E-mails — business facts only.
#
# Direction is carried entirely by `status`: received = inbound,
# sent / draft = outbound. There is no `direction` field.
#
# created_at is when the record entered our system:
#   sent      -> created_at <= sent_at  (drafted, then sent)
#   received  -> created_at >= sent_at  (customer sent it, then we recorded it)
#   draft     -> sent_at is null
#
# Unanswered inbound mail in this dataset is exactly EMAIL-004 and EMAIL-014.
# Every other received message has a later `sent` reply in the same thread.

